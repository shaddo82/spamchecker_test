<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>적당한 스팸 판별기 (AI Spam Checker)</title>
</head>
<body>
    <h1>스팸 판별기</h1>
    <textarea id="text" rows="5" cols="60"
        placeholder="스팸으로 의심되는 메시지를 붙여주세요!"></textarea><br><br>
    <button onclick="classify()">스팸 탐지</button>
    <h3 id="result" style="white-space: pre-line;"></h3>
    <script>
        function classify() {
            const text = document.getElementById("text").value;

            //  ISSUE2: Empty Input 처리
            const result = document.getElementById("result");
            if (!text) {
                result.innerText = "메시지를 입력해 주세요!";
                return;
            }

            fetch("/classify", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json" //fix
                },
                body: JSON.stringify({text})
            })
            .then(res => res.json())

            .then(data => {
                    // 출력 데이터 추가
                    let msg = "결과: " + data.label + " (score=" + data.score + ")";
                    const info = data.model_info || {};
                    const modelType = info.model_type ?? "N/A";
                    const testAcc = info.test_accuracy ?? "N/A";
                    const runId = info.run_id ?? "N/A";
                    msg += "\n모델: " + modelType;
                    msg += "\nTest Acc: " + testAcc;
                    msg += "\nRun ID: " + runId;
                    document.getElementById("result").textContent = msg;
                })
            .catch(() => {
                document.getElementById("result").innerText = "에러 발생";
            });
        }
    </script>
</body>
</html>
