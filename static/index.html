<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>적당한 스팸 판별기 (AI Spam Checker)</title>
</head>
<body>
    <h1>스팸 판별기</h1>
    <textarea id="text" rows="5" cols="60"
        placeholder="스팸으로 의심되는 메세지를 붙여넣어주세요!"></textarea><br><br>
    <button onclick="classify()">스팸 탐지</button>
    <h3 id="result" style="white-space: pre-line;"></h3>
    <br><br>
    <button onclick="sendFeedback('ham')">정답: ham</button>
    <button onclick="sendFeedback('spam')">정답: spam</button>
    <h3 id="feedbackResult"></h3>
    <script>
        let lastResult = null;

        function classify() {
            const text = document.getElementById("text").value;

            //  ISSUE2: Empty Input 처리
            const result = document.getElementById("result");
            if (!text) {
                result.innerText = "메시지를 입력해 주세요!";
                return;
            }

            fetch("/classify", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json" //fix
                },
                body: JSON.stringify({text})
            })
            .then(res => res.json())

            .then(data => {
                    // 출력 데이터 추가
                    let msg = "결과: " + data.label + " (score=" + data.score + ")";
                    const info = data.model_info || {};
                    const servingModel = data.serving_model ?? "N/A";
                    const modelType = info.model_type ?? "N/A";
                    const testAcc = info.test_accuracy ?? "N/A";
                    const runId = info.run_id ?? "N/A";
                    msg += "\n모델타입: " + servingModel;
                    msg += "\n모델: " + modelType;
                    msg += "\nTest Acc: " + testAcc;
                    msg += "\nRun ID: " + runId;
                    document.getElementById("result").textContent = msg;
                    lastResult = {
                        text: text,
                        prediction: data.label,
                        score: data.score,
                        serving_model: data.serving_model
                    };
                })
            .catch(() => {
                document.getElementById("result").innerText = "에러 발생";
            });
        }

        function sendFeedback(correctLabel) {
            if (!lastResult) {
                document.getElementById("feedbackResult").innerText =
                    "먼저 스팸 탐지를 실행하세요.";
                return;
            }

            fetch("/feedback", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    text: lastResult.text,
                    prediction: lastResult.prediction,
                    correct_label: correctLabel,
                    score: lastResult.score,
                    serving_model: lastResult.serving_model
                })
            })
            .then(res => res.json())
            .then(() => {
                document.getElementById("feedbackResult").innerText =
                    "피드백 저장 완료: " + correctLabel;
            })
            .catch(() => {
                document.getElementById("feedbackResult").innerText =
                    "피드백 저장 실패";
            });
        }
    </script>
</body>
</html>
